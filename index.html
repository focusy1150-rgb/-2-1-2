<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จองโต๊ะเรียน ห้อง ม.2/1 เทอม 2</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #f4f6fb; --card: #fff; --tx: #1f2937; --mut: #6b7280; --pri: #4f46e5; --free: #e0e7ff; --taken: #fca5a5; --mine: #86efac; --bd: #d1d5db; }
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--tx); padding: 12px; }
header { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto 12px; }
.card { background: var(--card); border-radius: 12px; padding: 16px; max-width: 1000px; margin: 0 auto 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.f { flex: 1; min-width: 120px; }
label { font-size: 0.85rem; color: var(--mut); display: block; margin-bottom: 4px; }
input { width: 100%; padding: 8px 10px; border: 1px solid var(--bd); border-radius: 8px; font: inherit; }
button { font: inherit; padding: 8px 14px; border: 0; border-radius: 8px; background: var(--pri); color: #fff; cursor: pointer; }
button.g { background: #e5e7eb; color: var(--tx); }
.room { overflow-x: auto; padding-bottom: 8px; }
.front { text-align: center; background: #374151; color: #fff; border-radius: 8px; padding: 8px; margin: 0 auto 16px; max-width: 300px; font-weight: 600; }
.zones { display: flex; gap: 20px; justify-content: center; min-width: 680px; }
.zone h3 { text-align: center; font-size: 0.95rem; margin: 0 0 8px; color: var(--mut); }
.grid { display: grid; gap: 6px; }
.zone.L .grid { grid-template-columns: repeat(2, 74px); }
.zone.C .grid, .zone.W .grid { grid-template-columns: repeat(3, 74px); }
.seat { width: 74px; height: 64px; border: 2px solid #a5b4fc; background: var(--free); border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.75rem; cursor: pointer; }
.seat b { font-size: 0.9rem; color: var(--mut); }
.seat.taken { background: var(--taken); border-color: #ef4444; }
.seat.mine { background: var(--mine); border-color: #16a34a; }
.legend { display: flex; gap: 12px; font-size: 0.85rem; align-items: center; }
.legend span { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: middle; }
</style>
</head>
<body>

<header>
  <h1 style="font-size: 1.3rem; margin: 0;">🪑 จองโต๊ะเรียน ห้อง ม.2/1 เทอม 2</h1>
  <button class="g" onclick="alert('แผงผู้ดูแล')">🔐 ผู้ดูแลระบบ</button>
</header>

<div class="card">
  <div class="row">
    <div class="f"><label>ชื่อเล่น</label><input id="nick" placeholder="เช่น ฟ้า"></div>
    <div class="f"><label>เลขที่</label><input id="no" type="number" placeholder="เช่น 12"></div>
  </div>
</div>

<div class="card">
  <div class="row" style="margin-bottom: 12px; justify-content: space-between;">
    <div class="legend">
      <div><span style="background:var(--free)"></span> ว่าง</div>
      <div><span style="background:var(--taken)"></span> ถูกจอง</div>
      <div><span style="background:var(--mine)"></span> โต๊ะของฉัน</div>
    </div>
  </div>

  <div class="room">
    <div class="front">🧑‍🏫 หน้าห้อง / โต๊ะครู / กระดาน</div>
    <div class="zones" id="zones"></div>
  </div>
</div>

<script>
// โครงสร้างโซนโต๊ะเรียน (40 โต๊ะ)
const ZONES = [
  { k: 'L', n: 'โซนซ้าย (นั่งคู่)', c: 2 },
  { k: 'C', n: 'โซนกลาง', c: 3 },
  { k: 'W', n: 'โซนหน้าต่าง', c: 3 }
];
const ROWS = 5;

// สร้างปุ่มโต๊ะทันทีเมื่อหน้าเว็บโหลด
function buildSeats() {
  const container = document.getElementById('zones');
  container.innerHTML = '';
  let id = 1;

  ZONES.forEach(z => {
    const zoneDiv = document.createElement('div');
    zoneDiv.className = 'zone ' + z.k;
    zoneDiv.innerHTML = `<h3>${z.n}</h3><div class="grid"></div>`;
    const grid = zoneDiv.querySelector('.grid');

    for (let r = 1; r <= ROWS; r++) {
      for (let c = 1; c <= z.c; c++) {
        const seatId = id++;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'seat';
        btn.innerHTML = `<b>${seatId}</b><span>ว่าง</span>`;
        btn.onclick = () => alert(`เลือกโต๊ะที่ ${seatId}`);
        grid.appendChild(btn);
      }
    }
    container.appendChild(zoneDiv);
  });
}

// เรียกรันการสร้างโต๊ะทันที
buildSeats();
</script>
</body>
</html>
